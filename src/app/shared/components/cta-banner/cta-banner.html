<section class="cta-banner">
  <div class="container cta-banner__inner">
    <div class="cta-banner__content">
      <h2>{{ headline() }}</h2>
      <p>{{ subtext() }}</p>
    </div>
    <a [routerLink]="buttonLink()" class="btn btn--accent btn--lg">
      {{ buttonText() }}
    </a>
  </div>
</section>
