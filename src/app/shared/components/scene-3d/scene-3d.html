<div class="scene-3d" [class.scene-3d--subtle]="variant() === 'subtle'" aria-hidden="true">
  <div class="scene-3d__stage">
    <div class="shape shape--cube">
      <div class="shape__face shape__face--front"></div>
      <div class="shape__face shape__face--back"></div>
      <div class="shape__face shape__face--right"></div>
      <div class="shape__face shape__face--left"></div>
      <div class="shape__face shape__face--top"></div>
      <div class="shape__face shape__face--bottom"></div>
    </div>
    <div class="shape shape--ring"></div>
    <div class="shape shape--sphere"></div>
    <div class="shape shape--pyramid"></div>
    <div class="shape shape--torus"></div>
    <div class="shape shape--orb"></div>
    <div class="shape shape--dots"></div>
  </div>
</div>
