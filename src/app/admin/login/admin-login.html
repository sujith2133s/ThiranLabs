<div class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <span class="login-logo">T</span>
      <h1>ThiranLabs Admin</h1>
      <p>Sign in to manage your website content and leads.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (error()) {
        <div class="login-error">{{ error() }}</div>
      }

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter admin password"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn--primary btn--full">Sign In</button>
    </form>

    <p class="login-hint">Default password: <code>admin123</code></p>
    <a routerLink="/" class="login-back">← Back to Website</a>
  </div>
</div>
